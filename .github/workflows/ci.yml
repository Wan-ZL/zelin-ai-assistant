# CI: lint gates (shellcheck + ruff), Python 3.9 floor tests, compile check,
# unit tests, and one macOS job (macOS runners are expensive — everything
# Apple-flavored lives in it: mac app build WITH Sparkle, shared-contract
# Swift tests, the Swift↔Python crypto interop gate, and the iOS simulator
# build) — on every pull request, on every merge-queue group, and on push to
# main.
#
# MERGE QUEUE (CONTRACT §56.2): every job that backs a required status check
# (ci, Lint, Tests on ubuntu ×2, Web tests, QA gates, Version pins untouched)
# runs on `merge_group` with the SAME job name and no pull_request-only
# context — the queue's checks_requested event must be able to turn every
# required context green by itself. PR-only jobs are the informational ones
# (Windows suite, qlty) and the contract reminder (needs github.base_ref).
# (The queue itself is unavailable on personal-account repos — §56.6's
# update-pr-branches.yml keeps PR heads current instead; the merge_group
# wiring stays for the day the repo moves to an organization.)
#
# TIMEOUTS (§56.6): every job carries timeout-minutes (Windows legs 30, the
# rest 40; qlty 15) — typical wall time is ≤4 min for the ubuntu legs and
# ~9 min for the macOS job. Without a cap a hung informational job holds the
# per-branch concurrency group for GitHub's 6-hour default and blocks every
# later run on that PR.
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Every job only reads the repo — no job creates releases, comments, or pushes.
permissions:
  contents: read

# Cancel superseded runs on the same PR/branch (never cancels main pushes or
# merge-queue groups mid-run — a cancelled queue run would evict the entry).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (shellcheck + ruff)
    # Runs on ubuntu in parallel with the macOS build job — shellcheck is
    # preinstalled on the ubuntu runner image.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false

      - name: shellcheck all tracked shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install ruff
        # Exact pin so a ruff upgrade is a deliberate PR, not a surprise CI failure.
        run: python3 -m pip install ruff==0.15.20

      - name: ruff check
        # Rule set lives in ruff.toml at the repo root.
        run: ruff check .

  tests-linux:
    name: Tests on ubuntu (Python ${{ matrix.python-version }})
    # README/docs promise Python 3.9+ and docs/PORTING.md promises the headless
    # core runs on Linux — same suite on the documented floor (3.9) and on
    # current python. The act pipeline is pure Python + PyYAML (tests inject
    # fake runners instead of shelling out); darwin-only paths guard themselves
    # behind the OS seam (act/lib/platform.py) instead of failing here.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML + hypothesis
        # hypothesis = dev/test-only（§0 宪法第 7 条：运行时白名单不变）——
        # 驱动 tests/test_provenance.py 的宪法性质测试；没装时那些测试自动 skip。
        run: python3 -m pip install "pyyaml>=6,<7" hypothesis

      - name: Compile Python sources
        run: python3 -m compileall -q act ingest server

      - name: Run unit tests
        run: AIASSISTANT_HOME=$(mktemp -d) python3 -m unittest discover -s tests

  contract-reminder:
    name: Contract reminder (soft gate)
    # 软门（§0 宪法配套）：act/ 或 mac/Sources/ 的行为改动通常应伴随
    # docs/CONTRACT.md 的同 PR 修法。只提醒（::warning::），永不阻塞——
    # 纯重构/修 typo 不该被一个文档门拦住，判断力在 reviewer。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Warn when code changed without a contract update
        # base_ref 经 env 进 shell，绝不直接插值进 run 脚本体（zizmor
        # template-injection：分支名是攻击者可控字符串，展开即代码）。
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="origin/${BASE_REF}"
          git fetch --quiet origin "${BASE_REF}"
          CHANGED="$(git diff --name-only "$(git merge-base "$BASE" HEAD)"...HEAD)"
          if echo "$CHANGED" | grep -qE '^(act/|mac/Sources/)' \
             && ! echo "$CHANGED" | grep -q '^docs/CONTRACT.md$'; then
            echo "::warning title=CONTRACT.md untouched::This PR changes act/ or mac/Sources/ without updating docs/CONTRACT.md. If it changes behavior, amend the matching § (or §0) in this PR; if it's a pure refactor/fix, say so in the description. See CLAUDE.md."
          else
            echo "contract check: ok"
          fi

  tests-windows:
    name: Tests on windows (Python ${{ matrix.python-version }})
    # The act pipeline is pure Python + PyYAML; running the same suite on Windows
    # catches real path/OS bugs and is the cross-platform CI foundation (see
    # docs/LINUX.md). POSIX-only checks (file modes, launchd/cron, shell-shim
    # resolution) guard themselves with sys.platform / os.name and are skipped
    # here — never deleted. Windows service wiring (Task Scheduler) is a later
    # port; this job only proves the portable core imports + runs on Windows.
    #
    # INFORMATIONAL for now: the Windows suite has never actually run, so its
    # first CI runs may surface path/OS bugs. continue-on-error keeps a red
    # Windows run from failing the workflow / blocking PRs until it's driven
    # green — flip this off once Windows is reliably passing.
    # Informational → not needed in the merge queue (saves a Windows runner).
    if: github.event_name != 'merge_group'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash is preinstalled on the windows runner — run the ubuntu
        # commands verbatim so the three jobs stay in lockstep.
        shell: bash
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6,<7"

      - name: Compile Python sources
        run: python -m compileall -q act ingest server

      - name: Run unit tests
        # tests/__init__.py points AIASSISTANT_HOME at a throwaway tmp dir before
        # any act import, so the sandbox is hermetic on Windows too.
        env:
          AIASSISTANT_HOME: ${{ runner.temp }}
        run: python -m unittest discover -s tests

  version-pins:
    name: Version pins untouched
    # CONTRACT §56.1 — no PR may carry a version: the iOS MARKETING_VERSION
    # placeholders, the act/__init__.py fallback line (refresh to the latest
    # tag excepted) and CHANGELOG version headings are all read-only for PRs.
    # §56.7 — nor may a PR write the two shared append-only ledgers by hand:
    # new CHANGELOG bullets / `### ` headings ([Unreleased] is frozen,
    # shrink-only) and new `| YYYY-MM-DD |` rows in vnext2-plan §8 are
    # rejected; the PR adds a changelog.d/<slug>.md and a
    # docs/design/progress/<date>-<slug>.md fragment instead, and this job
    # validates their shape (a malformed fragment would otherwise vanish
    # silently from the release notes — release.yml only warns).
    # HEAD is the synthetic merge commit on both events (PR: refs/pull/N/merge;
    # queue: the group's merge commit) — HEAD^1 = base, HEAD^2 = PR head, so
    # `git diff HEAD^1 HEAD` is exactly the PR's change and merge-base(HEAD^1,
    # HEAD^2) is where the PR forked. CUTOVER: a PR whose fork point predates
    # this gate (that tree has no scripts/ci/version_pins_check.py) still
    # carries a legacy hand bump — tolerated (notice only) until it rebases
    # past the cutover; then hand bumps are rejected for good.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Reject hand-bumped versions
        run: |
          set -euo pipefail
          git rev-parse -q --verify HEAD^1 >/dev/null || { echo "::error::HEAD has no first parent — expected the synthetic merge commit"; exit 1; }
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            FORK="$(git merge-base HEAD^1 HEAD^2)"
          else
            FORK="$(git rev-parse HEAD^1)"
          fi
          LEGACY=""
          if ! git cat-file -e "$FORK:scripts/ci/version_pins_check.py" 2>/dev/null; then
            echo "::notice::fork point $FORK predates the no-version-edits gate — legacy PR, hand bumps tolerated until it rebases"
            LEGACY="--legacy-base"
          fi
          LATEST_TAG="$(git tag -l 'v[0-9]*' | python3 scripts/ci/release_tags.py highest || true)"
          echo "latest release tag: ${LATEST_TAG:-none}"
          # shellcheck disable=SC2086 # $LEGACY is either empty or one flag
          git diff HEAD^1 HEAD | python3 scripts/ci/version_pins_check.py --latest-tag "${LATEST_TAG}" $LEGACY

      - name: Validate changelog.d and progress fragments
        # §56.7 — shape check of every fragment in the tree (not just the
        # PR's): name pattern, `type:` line, bullets only / header keys + body.
        run: |
          set -euo pipefail
          python3 scripts/ci/changelog_fragments.py check
          python3 scripts/ci/progress_log.py check

      - name: Hint at released fragments that can be pruned
        # §56.7 — CI never commits to main, so consumed fragments are pruned
        # by the next PR that touches changelog.d/. This only prints a
        # ::notice:: (never fails) while fragments already shipped in the
        # latest tag are still in the tree.
        run: python3 scripts/ci/changelog_prune.py --notice

  web-tests:
    name: Web tests (build + vitest)
    # web/ 看板前端（v0.48 §49）：tsc --noEmit + vite build 抓类型/打包回归，
    # vitest 跑 web/src/*.test.* 纯逻辑测试。ubuntu 上跑（无浏览器，jsdom）。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Run vitest
        run: npx vitest run

  qa-gates:
    name: QA gates (complexity + CRAP + coverage floor + deps + hygiene)
    # 合并硬门四把尺（docs/CONTRACT.md §58；owner 决策 D4/D5）：每函数圈复杂度
    # ≤6、CRAP ≤6、总覆盖率不低于 qa/coverage_floor.txt、模块依赖方向 + 防腐
    # 十条机械化——全部对着 qa/*_baseline.txt 的 shrink-only 存量账本判决，
    # 所以老代码不挡门、新代码必须干净、账本只许缩（清账 = P3）。
    # 出生时是非必需检查；在 main 上证明稳定后再升 required（§58.5）。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false
          # ledger_diff 要跟 PR base（merge ref 的第一父提交）比较 qa/ 文件
          # ——多取一层父提交（push 到 main 时该步跳过，深度 2 无副作用）。
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 钉小版本：coverage 派生的 CRAP 账本要求跑门的解释器可复现
          # （qa/crap_baseline.txt 就是在这个版本的 ubuntu 腿上收的账）。
          python-version: "3.13"

      - name: Ledger shrink-only diff vs PR base
        # §58.4 的另一半：三态判决看不见「账本自己长了」——新增债务 + 同 PR
        # 自记账在三态下照样全绿。这里把 qa/*_baseline.txt（加键/抬分）、
        # qa/coverage_floor.txt（下调）、qa/gates.toml（放宽/删键）与 merge
        # ref 的第一父（= 当前 main；merge queue 的临时 merge commit 同形）
        # 比较，任何放宽即 FAIL。push 到 main 时没有 base 可比，跳过。
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: python3 scripts/qa/ledger_diff.py --base HEAD^1

      - name: Install PyYAML + coverage
        # coverage = dev/CI-only（§0 宪法第 7 条：运行时白名单 stdlib+PyYAML 不变）
        run: python3 -m pip install "pyyaml>=6,<7" coverage

      - name: Run QA gates
        # 全套 unittest 在 coverage 下跑一遍 + 五道门；判决与建议账本落
        # .qa-report/（下面整目录上传——收账 = 从 artifact 拷回 qa/）。
        run: bash scripts/qa/run_gates.sh

      - name: ruff C901 advisory cross-check
        # 参考尺不判卷（§58.1）：mccabe 的计数口径与 scripts/qa/complexity.py
        # 略异，仅作交叉参照，永不阻塞（阈值同源 qa/gates.toml）。
        if: always()
        run: |
          python3 -m pip install ruff==0.15.20
          MAX="$(python3 scripts/qa/complexity.py --print-threshold)"
          ruff check act server scripts --extend-select C901 --config "lint.mccabe.max-complexity=${MAX}" \
            || echo "::notice title=C901 advisory::mccabe findings above are informational (authoritative gate: scripts/qa/complexity.py)"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-report
          path: .qa-report/
          # v4 默认丢弃隐藏路径（CVE-2024-43784 后的安全默认）；.qa-report/
          # 是点目录且内容只有本 job 生成的判决/榜单/建议账本，无秘密。
          include-hidden-files: true

  qlty:
    name: qlty check (informational)
    # .qlty/qlty.toml 早就配好 9 个 plugin（bandit/trivy/trufflehog/zizmor/
    # actionlint/…）却从未在 CI 跑过（UNCLEBOB 审计的「配好未接线」项）。
    # R2.3.8 第一步：先以 informational 身份接线——continue-on-error 与
    # tests-windows 同款，红了不挡 PR；稳定后再议安全类 plugin 升门。
    # informational → merge queue 里不跑。
    if: github.event_name != 'merge_group'
    continue-on-error: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false

      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

      - name: qlty check
        run: qlty check --all --no-cache --no-progress

  ci:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false

      - name: Select pinned Xcode
        # The Swift sources target a recent toolchain (local dev builds on Swift 6.x /
        # macOS 26 SDK); older default Xcodes fail on main-actor isolation rules.
        # PINNED (issue #15): the version lives in .github/xcode-version and is
        # shared with release.yml through scripts/ci/select_xcode.sh, so CI and
        # the release build of the same commit always use the same toolchain.
        # A pin missing from the image fails loudly — no "newest" fallback.
        # Bump = edit .github/xcode-version in a PR.
        run: bash scripts/ci/select_xcode.sh

      - name: Install PyYAML + cryptography
        # Fallback covers PEP 668 "externally managed" Pythons on the runner image.
        # cryptography is act/lib/e2e.py's lazy dependency, exercised by the
        # Swift↔Python interop gate below.
        run: python3 -m pip install --user "pyyaml>=6,<7" cryptography || python3 -m pip install --user --break-system-packages "pyyaml>=6,<7" cryptography

      - name: Compile Python sources
        run: python3 -m compileall -q act ingest server

      - name: Run unit tests
        run: AIASSISTANT_HOME=$(mktemp -d) python3 -m unittest discover -s tests

      - name: Verify the committed version pins are the placeholder
        # CONTRACT §56.1: the version's truth is the git tag on main; nothing
        # committed carries it. ios/project.yml + the two pbxproj pins stay
        # 0.0.0-dev in git and are stamped on the runner right below — a hand
        # bump here would drift the moment the next PR merges (the tri-pin
        # rebase storm this replaced) and is rejected by this gate as well as
        # by the "Version pins untouched" job.
        run: python3 scripts/version_stamp.py --check-pins

      - name: Stamp the version (act/_version.py + iOS pins, runner-only)
        # git describe on a shallow PR checkout finds no tag → the stamp is the
        # baked fallback; on a tag checkout it is the tag. Either way the Mac
        # app, the Swift tests and the iOS simulator build below all see one
        # consistent version, and nothing is committed.
        run: python3 scripts/version_stamp.py --write --ios

      - name: Vendor Sparkle (framework + tools)
        # Release builds link Sparkle (release.yml runs this same SHA-pinned
        # script). Without it here, every `#if canImport(Sparkle)` block
        # (updater wiring + the Settings update UI) compiles OUT of PR CI, so
        # a symbol break inside those blocks merges green and only explodes at
        # tag time — after the tag already exists.
        run: bash mac/scripts/fetch-sparkle.sh

      - name: Build macOS app (with Sparkle, like a release build)
        run: bash mac/build.sh

      - name: Build board shell app (shell/build.sh — install.sh's ui step)
        # CONTRACT §56.5: merge = deploy now includes the UI; the shell must
        # compile on the CI toolchain or the auto-deploy `ui` step fails and
        # rolls the deploy back. ZAI_PORT stamping is exercised too. shell/ also
        # hosts the recording + live-captions engines moved from mac/Sources
        # (§61.3) and the zaiShell bridge (§61.1).
        run: ZAI_PORT=47820 bash shell/build.sh

      - name: Shell bridge tests (shell/tests, plain swiftc)
        # §61.5: typecheck the shell module + run the XCTest-free harness that
        # pins the zaiShell wire vocabulary and the LegacyPrefs seed rules.
        run: bash shell/tests/run.sh

      - name: Swift logic tests (mac/LogicTests, swift test)
        # 本地第四道门（CONTRIBUTING.md）：⌘V 认领矩阵
        # (PastedImages.isImagePaste/readImages) — a Swift Testing package
        # whose sources are SYMLINKS into mac/Sources, so the code under test
        # is the real file. The wrapper is exactly
        # `swift test --package-path mac/LogicTests` under full Xcode; it only
        # adds framework search flags on Xcode-less CLT machines (see test.sh).
        run: bash mac/LogicTests/test.sh

      - name: Swift contract tests (shared/Sources, plain swiftc)
        # Behavior tests for the lossy dashboard.json row decode (Contract.swift)
        # and the board-lane merge/badge logic (BoardModel.swift) — shared logic
        # both apps compile but nothing else executes. No Xcode project needed.
        run: bash ios/tests/contract/run.sh

      - name: Swift captions tests (CaptionCore, plain swiftc)
        # 实时字幕 pure-logic gate: byte-exact Doubao ASR wire framing, gzip
        # payload decode, definite/partial dedup, and the 2-line caption
        # roll-up reducer (mac/Sources/CaptionCore.swift) — the only
        # executable check on the hand-rolled binary protocol.
        run: bash ios/tests/captions/run.sh

      - name: Swift board-diff tests (BoardDiff, plain swiftc)
        # v0.43 手感 gate: the pure snapshot differ driving the kanban flight
        # layer (mac/Sources/BoardDiff.swift) — first-load, moves vs reorder
        # noise, inserts/removals, and the >6-change crossfade cap.
        run: bash ios/tests/boarddiff/run.sh

      - name: Swift↔Python E2E crypto interop
        # The ONLY check that ios/Sources/E2E.swift byte-interops with
        # act/lib/e2e.py (tests/test_e2e.py is Python↔Python only): the frozen
        # ZSYN/ZQR1 wire contract between the pipeline and the phone, both
        # directions. Plain swiftc + CryptoKit — no Xcode project needed.
        run: bash ios/tests/interop/run.sh

      - name: Build iOS app (simulator, no signing)
        # ios/Sources was previously compiled by NO workflow — an iOS-only (or
        # shared-contract-used-only-by-iOS) break merged green and surfaced at
        # the maintainer's next manual Xcode open. Builds the committed project
        # (canonical spec: ios/project.yml; the pbxproj is kept in sync, so CI
        # needs no xcodegen). Simulator destination → no signing identity.
        run: |
          set -euo pipefail
          xcodebuild -project ios/ZelinAIAssistant.xcodeproj \
                     -scheme ZelinAIAssistant \
                     -destination 'generic/platform=iOS Simulator' \
                     CODE_SIGNING_ALLOWED=NO \
                     build
