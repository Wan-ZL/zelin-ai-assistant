# CI nightly — the informational legs that used to ride every pull request
# (CONTRACT §56.8): the Windows test suite and the qlty plugin sweep. Both are
# continue-on-error, neither backs a required check, and both were red on
# most PRs while eating two Windows slots + one ubuntu slot out of the free
# plan's concurrency budget per PR. Here they run once a day against main
# (+ workflow_dispatch for a run on demand), which is exactly as often as
# anyone acts on them.
#
# Never a PR gate: keep this workflow out of the required-checks set. A
# Windows regression or a qlty finding is read from this run's summary (or
# the P5 daily loop picks it up), not from a blocked PR.
#
# Cadence: after mutation-nightly (09:03 UTC) and usage insights (09:23 UTC)
# so the scheduled jobs never compete with each other for slots.
name: CI nightly

on:
  schedule:
    - cron: "43 10 * * *" # daily at 10:43 UTC (03:43 US Pacific)
  workflow_dispatch:

# Every job only reads the repo — no job creates releases, comments, or pushes.
permissions:
  contents: read

# One nightly at a time; a manual dispatch queues behind a running one
# instead of cancelling it (a cancelled run tells nobody anything).
concurrency:
  group: ci-nightly
  cancel-in-progress: false

jobs:
  tests-windows:
    name: Tests on windows (Python ${{ matrix.python-version }})
    # The act pipeline is pure Python + PyYAML; running the same suite on Windows
    # catches real path/OS bugs and is the cross-platform CI foundation (see
    # docs/LINUX.md). POSIX-only checks (file modes, launchd/cron, shell-shim
    # resolution) guard themselves with sys.platform / os.name and are skipped
    # here — never deleted. Windows service wiring (Task Scheduler) is a later
    # port; this job only proves the portable core imports + runs on Windows.
    #
    # INFORMATIONAL: the Windows suite has never been driven green; its runs
    # surface path/OS bugs. continue-on-error keeps a red Windows run from
    # failing the workflow — flip this off once Windows is reliably passing.
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash is preinstalled on the windows runner — run the ubuntu
        # commands verbatim so the legs stay in lockstep with ci.yml.
        shell: bash
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6,<7"

      - name: Compile Python sources
        run: python -m compileall -q act ingest server

      - name: Run unit tests
        # tests/__init__.py points AIASSISTANT_HOME at a throwaway tmp dir before
        # any act import, so the sandbox is hermetic on Windows too.
        env:
          AIASSISTANT_HOME: ${{ runner.temp }}
        run: python -m unittest discover -s tests

  qlty:
    name: qlty check (informational)
    # .qlty/qlty.toml 早就配好 9 个 plugin（bandit/trivy/trufflehog/zizmor/
    # actionlint/…）；R2.3.8 第一步以 informational 身份接线——continue-on-error
    # 与 tests-windows 同款，红了不挡任何东西；稳定后再议安全类 plugin 升门。
    continue-on-error: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no step pushes or uses git auth after checkout — don't leave the
          # token in .git/config for later steps to read
          persist-credentials: false

      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

      - name: qlty check
        run: qlty check --all --no-cache --no-progress
