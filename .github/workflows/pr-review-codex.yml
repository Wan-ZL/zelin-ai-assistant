# Codex PR review — second-opinion advisory review ON DEMAND (CONTRACT §56.8).
#
# Same trigger and design rules as pr-review-claude.yml: the `review:ai`
# label (consumed once picked up) or a workflow_dispatch with the PR number;
# fork PRs skipped, missing OPENAI_API_KEY = green no-op, superseded runs
# cancelled, never a required check. Codex runs read-only over the checkout
# (safety guidance from the action docs); the diff is pre-materialized with
# `gh pr diff` so the sandbox never needs network or git writes. The final
# message is posted as one PR comment.
name: Codex PR Review

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
        type: number

concurrency:
  group: codex-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

# Job-level grants only (the default workflow token is read-only in this repo).
permissions: {}

jobs:
  review:
    name: review (advisory, on demand)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.label.name == 'review:ai'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of the PR under review
      pull-requests: write # inline review comments + consuming the review:ai label
      issues: write # the summary comment goes through the issues API
    # §56.6 timeout discipline — a hung review must not hold a slot for 6 h.
    timeout-minutes: 30
    steps:
      - id: pr
        name: Resolve the PR, consume the label, probe the API key
        # Every dynamic value enters the shell via env (zizmor
        # template-injection); same shape as pr-review-claude.yml.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
          KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          set -euo pipefail
          PR="${EVENT_PR:-$INPUT_PR}"
          case "$PR" in (*[!0-9]*|"") echo "::error::no PR number"; exit 1 ;; esac
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label "review:ai" 2>/dev/null \
            || echo "label review:ai already gone (or never set) on #$PR"
          CROSS="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)"
          HEAD="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          RUN="$KEY_PRESENT"
          if [ "$CROSS" = "true" ]; then
            echo "::notice::PR #$PR is from a fork — bot review skipped"
            RUN=false
          elif [ "$RUN" != "true" ]; then
            echo "::notice::OPENAI_API_KEY not configured — review skipped (green no-op)"
          fi
          {
            echo "number=$PR"
            echo "head=$HEAD"
            echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # label event: the default (the PR's synthetic merge ref); dispatch
          # → the PR head resolved above (same-repo only)
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.pr.outputs.head || '' }}

      - if: steps.pr.outputs.run == 'true'
        name: Materialize the PR diff for the sandboxed review
        # `gh pr diff` reads the diff from the API — no base fetch, no
        # github.base_ref (empty on dispatch), works for both triggers.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" > /tmp/pr.diff
          wc -c /tmp/pr.diff

      - if: steps.pr.outputs.run == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: /tmp/codex-review.md
          sandbox: read-only
          # empty model = Codex 自选当前默认（跟着官方最新走，owner 要求）;
          # 想钉住某个具体模型时取消下一行注释（API 模型 id 以 OpenAI 文档为准）
          # model: gpt-5.6
          effort: high

      - if: steps.pr.outputs.run == 'true'
        name: Load the review into env
        run: |
          set -euo pipefail
          {
            echo "CODEX_FINAL_MESSAGE<<CODEX_EOF"
            cat /tmp/codex-review.md
            # the final message may lack a trailing newline — without this
            # the terminator glues onto the last content line and GITHUB_ENV
            # fails with "Matching delimiter not found"
            echo ""
            echo "CODEX_EOF"
          } >> "$GITHUB_ENV"

      - if: steps.pr.outputs.run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: "## Codex review\n\n" + process.env.CODEX_FINAL_MESSAGE,
            })
