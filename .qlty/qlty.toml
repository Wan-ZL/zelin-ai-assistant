# Try Qlty Cloud: https://qlty.sh
#
# For a guide to configuration, visit https://qlty.sh/d/config
# Or for a full reference, visit https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  # NOTE: this qlty-init default collides with this repo's real `config/` dir
  # (Slack app manifests today — no code, so harmless). If a config/*.py or
  # config/*.sh ever lands there it would silently escape every linter: narrow
  # this pattern then instead of adding a per-file ignore.
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
# lint driver only: the repo's Python gate is `ruff check` (ruff.toml, CI + the
# four local gates in CONTRIBUTING.md) — formatting is deliberately NOT
# legislated, so the fmt driver reports ~60 phantom "issues" no gate asks for.
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trivy"
# pinned: the plugin's known_good tag (0.67.2) 404s on GitHub releases
version = "0.72.0"
drivers = [
  "config",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# --------------------------------------------------------------------------
# Triaged rule ignores — every block carries its reason (chore/qlty-cleanup).
#
# EVERY block needs `file_patterns` (`["**"]` for repo-wide): qlty >= 0.643
# SILENTLY DROPS an [[ignore]] that has none (`qlty check` prints a warning and
# moves on), which resurrected all the rules below on every PR until v0.48.
# --------------------------------------------------------------------------

# bandit audits production code. Tests deliberately hardcode fake tokens
# ("xoxp-test"), /tmp fixture path strings, parse self-generated XML, and
# drive the CLI under test through subprocess — all by design. trufflehog
# still scans tests for real secrets.
[[ignore]]
file_patterns = ["tests/**"]
plugins = ["bandit"]

# Shelling out (claude CLI, osascript, git, open, ffmpeg) IS this product's
# core mechanism — a local orchestrator daemon. Call sites use list argv with
# shell=False and were individually reviewed in the v0.33.1 whole-repo audit
# (PR #49). B404 (import subprocess) and B603 (subprocess without shell) flag
# every use unconditionally, so they are pure noise here.
[[ignore]]
file_patterns = ["**"]
rules = ["bandit:B404", "bandit:B603"]

# Tools are resolved from PATH on purpose: user machines have homebrew /
# system / pyenv layouts, and a hardcoded absolute path broke real installs
# before (ffmpeg, PR #42).
[[ignore]]
file_patterns = ["**"]
rules = ["bandit:B607"]

# try/except/pass|continue is the documented best-effort idiom in the
# daemons: one bad record or a missing optional tool must never crash a
# radar/sync loop. Sites were reviewed in the v0.33.1 whole-repo audit.
[[ignore]]
file_patterns = ["**"]
rules = ["bandit:B110", "bandit:B112"]

# store2's SQL interpolates COLUMN / TABLE NAMES drawn from module-level
# whitelists (_CARD_COLUMNS, _MUTABLE_FIELDS, the notes receipt columns) while
# every VALUE stays parameter-bound — the one shape B608
# (hardcoded_sql_expressions) cannot tell apart from real injection. Scoped to
# store2 so a genuine f-string query elsewhere still fails the gate. (Sites
# carry `# noqa: S608` for ruff; that pragma does not silence bandit.)
[[ignore]]
file_patterns = ["act/lib/store2/**"]
rules = ["bandit:B608"]
