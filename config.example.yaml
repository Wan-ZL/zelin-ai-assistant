# Zelin's AI Assistant lite 2.0 配置模板 — install.sh 首次运行时复制为 config.yaml（config.yaml 不入库，
# 之后永不覆盖）。设置页改的值写进 state/settings_overrides.json，优先级高于这里；这份文件只放
# 代码真读的键（act/lib/config.py、act/lib/recap_store.py、server/settings_catalog.py）。
# Anthropic API key 不在这里：设置页 > 凭证，或 config/secrets/anthropic-api-key.txt（CONTRACT §19）。

# UI 语言（§15）：zh | en。界面、系统通知与修法句子跟它走。
language: zh

sources:
  # Obsidian vault 的 2 - raw 目录。ingest 把录屏导出成笔记、按 vault 自己的 CLAUDE.md 约定整理进 wiki。
  obsidian_raw: "~/Documents/Obsidian Vault/2 - raw"
  # 另外三个目录缺省时由 obsidian_raw 的上级目录（vault 根）+ 标准目录名派生，通常不用填；
  # ingest 脚本经 `python3 -m act.lib.config --print-path` 读同一份解析结果。
  # obsidian_unprocessed: "~/Documents/Obsidian Vault/1 - unprocessed"
  # obsidian_change_summary: "~/Documents/Obsidian Vault/3 - change-summary"
  # obsidian_wiki: "~/Documents/Obsidian Vault/4 - wiki"

recording:                             # 屏幕采集（§61 / §72）
  # 命中的窗口在采集阶段就被录制引擎跳过（screenpipe --ignored-windows），OCR / 截图不会写进
  # ~/.screenpipe/db.sqlite；ingest/screenpipe-export.sh 用同一清单过滤引擎重启前已存的帧。
  # 匹配：大小写不敏感的子串，同时比 app 名与窗口标题；`App::Title` 只排除该 app 里标题含 Title 的窗口，
  # `::Title` 只按窗口标题。`ignored_apps: []` = 明确关闭过滤（不推荐）。改完重启录制生效。
  ignored_apps:
    - 1Password
    - Bitwarden
    - LastPass
    - KeePassXC
    - Keychain Access
    - Private Browsing                 # Safari 无痕窗口（按窗口标题匹配）
    - Incognito                        # Chrome/Edge 无痕窗口（按窗口标题匹配）
  # retention_days（§72.2）：db.sqlite 里「已导出进 vault 且早于 N 天」的 OCR / 转写行由 cron 链的 cleanup
  # 步删掉（分批、不 VACUUM）。0 = 永久保留（出厂）。设置页「录制数据与磁盘」同一把旋钮。
  # retention_days: 0
  # media_retention_minutes（§72.4）：原始 jpg / mp4 在 ~/.screenpipe/data 里保留多少分钟，区间 [5, 525600]，
  # 出厂 60。不碰 db.sqlite 的文本行。
  # media_retention_minutes: 60

recap:                                 # 会议纪要（§63）：cron 链的一步，只读 ~/.screenpipe/db.sqlite，
                                       # 确定性判会议 session，结束后出 copy-only 纪要到 state/recap/。没有发送路径。
  enabled: true                        # 关 = 整条静默（设置页「会议纪要」同一开关）
  default_language: auto               # auto | zh | en —— 详情页先显示哪一版
  # ---- session 判定（分钟；坏值回默认） ----
  # gap_minutes: 5                     # 静默超过即切 session
  # quiet_minutes: 5                   # 距最后事件 ≥ 此值且无待转写 → CLOSED
  # min_span_minutes: 10               # session 跨度下限
  # min_presence_frames: 3             # 会议窗口帧数下限
  # force_close_minutes: 120           # 引擎死了：最后事件太久以前 → 强制 CLOSED
  # max_session_minutes: 240           # 超长 session 切段
  # audio_only_sessions: false         # 没有会议窗口的纯音频（面谈）是否算 session
  # timezone: America/Los_Angeles      # dedup key 的时区
  # meeting_windows:                   # 追加会议应用规则（默认表：Zoom / Teams / Webex / FaceTime / Meet / Slack Huddle）
  #   - {slug: gather, app: Gather}
  # ---- 出稿 ----
  # default_shape: lines               # lines = 快速五行 | sections = 可发送的分节长版（§63.10）
  # max_per_run: 2                     # 每轮最多出几份（多的留到下一轮）
  # max_per_day: 8                     # 每个本地日上限
  # retention_days: 90                 # recaps/<key>.json 保留天数
  # dismissed_retention_days: 14       # 按过「忽略」的那份保留天数
  # db_path: ~/.screenpipe/db.sqlite   # 引擎 DB 位置

models:                                # 模型（§59）：两把旋钮，都只是 claude 的 --model / --fallback-model
  # pipeline: claude-opus-5            # 会议纪要用的模型（形状合法的模型 id；ingest 跟随 claude 的默认）
  # fallback: "claude-opus-5[1m]"      # 主模型拿不到时切到的模型；off = 不传旗标

redaction:                             # 发给模型之前的本地脱敏（act/lib/sanitize.py）
  enabled: false                       # 词表脱敏（默认关；打开会改变模型看到的内容）
  terms_file: config/redaction_terms.txt  # 你的词表（一行一条，re: 前缀 = 正则；install.sh 从模板建）
  mask_secrets: true                   # 内置密钥 / token 掩码；默认开，不依赖 enabled

updates:                               # 更新（§26 / §79）
  check_enabled: true                  # 至多每 24h 向 GitHub releases/latest 查一次版本号（唯一的非模型出网）
  auto_install: false                  # 发现同一大版本内的新版时自动跑 scripts/upgrade.sh（默认关：关于页「立即升级」）

# server:
#   port: 47820                        # 看板 server 的本机端口（§54；install.sh 渲染进 LaunchAgent 与壳）

# execution:
#   claude_bin: ~/.local/bin/claude    # 显式钉死 claude CLI 路径（默认：稳定副本 → PATH → ~/.local/bin）
