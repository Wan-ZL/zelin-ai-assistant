  - generic [ref=e97]:
    - strong [ref=e98]: How the scores were produced.
    - text: "(1) Every resume was scored 0–3 on six dimensions (A: LLM post-training, B: agents & evals, C: software engineering, D: rigor & drive, E: safety bonus, F: AI-leverage bonus) with exact resume quotes required as evidence. (2) Every preliminary shortlist candidate was independently re-scored by a second reviewer pass; disagreements ≥ 3 points went to a third tie-breaking pass, and the per-dimension median was taken. (3) The Tier-1 threshold was set at consensus score ≥ 11 with A ≥ 2 or B ≥ 2, landing the shortlist at 68 (the guide targets 50–120). (4) Each Tier-1 candidate's load-bearing claims (papers, GitHub repos, projects) were then checked against the public web: 1 candidates had a claim fail verification (marked \"verify before advancing\" in the report), 0 flagged as possible fabrication for human review."
