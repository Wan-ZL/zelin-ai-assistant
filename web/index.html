<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- 相对引用（./）配合 vite base:"./"：由 server 静态服务 dist 时仍然正确；路由只用 query，文档恒在根 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Zelin's AI Assistant</title>
    <script>
      // 首帧前应用主题偏好，避免闪色（FOUC）。key: zai.theme = "light" | "dark"。
      // 默认浅色（CONTRACT §54.4 / §66.2 theme:default，owner 2026-09-02）：没有存储偏好时不跟随系统深色，
      // 显式落 light；暗色只由顶栏切换按钮选择并持久化。
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("zai.theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (_) { /* localStorage 不可用：按默认浅色 */ }
        if (theme === "dark") {
          document.documentElement.dataset.theme = "dark";
        } else {
          document.documentElement.dataset.theme = "light";
        }
        // 设置 → 通用「看板动画」（原生 UserDefaults boardAnimations 同名键）：关了就首帧关，避免闪一下动效
        try {
          if (localStorage.getItem("boardAnimations") === "false") document.documentElement.dataset.boardAnimations = "off";
        } catch (_) { /* 按默认开 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
