<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- 相对引用（./）配合 vite base:"./"：由 server 静态服务 dist 时仍然正确；路由只用 query，文档恒在根 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Zelin's AI Assistant</title>
    <script>
      // 首帧前应用主题偏好（localStorage 覆写 > 系统），避免暗色闪白（FOUC）。
      // key: zai.theme = "light" | "dark"；未设置时交给 tokens.css 的 prefers-color-scheme。
      (function () {
        try {
          var theme = localStorage.getItem("zai.theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (_) { /* localStorage 不可用时静默走系统偏好 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
