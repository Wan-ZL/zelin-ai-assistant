<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- 相对引用（./）配合 vite base:"./"：由 server 静态服务 dist 时仍然正确；路由只用 query，文档恒在根 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Zelin's AI Assistant</title>
    <script>
      // 首帧前应用主题偏好（localStorage 覆写 > 系统），避免暗色闪白（FOUC）。
      // key: zai.theme = "light" | "dark"；未设置时交给 tokens.css 的 prefers-color-scheme。
      (function () {
        try {
          var theme = localStorage.getItem("zai.theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (_) { /* localStorage 不可用时静默走系统偏好 */ }
      })();
      // 首帧前应用显示偏好缓存（字号 / 字重 / 描边，CONTRACT §54.1 第 12 项），避免 server 快照到达前字号跳变。
      // key: zai.display = {"text_size","text_weight","stroke"}（displayPrefs.ts 写）；值 → CSS 变量的映射在 tokens.css。
      // 这里只搬三个白名单键到 data-*，不认别的键、不认非字符串；server 快照到达即覆盖。
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem("zai.display") || "null");
          if (!prefs || typeof prefs !== "object") return;
          var map = { text_size: "textSize", text_weight: "textWeight", stroke: "stroke" };
          for (var key in map) {
            var value = prefs[key];
            if (typeof value === "string" && /^[a-z]{1,8}$/.test(value)) {
              document.documentElement.dataset[map[key]] = value;
            }
          }
        } catch (_) { /* 坏缓存 / 无 localStorage：走 tokens.css 默认档 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
